[project]
name = "languages-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
description = "Controlled language coding benchmark and private grading harness"

[project.scripts]
langbench = "langbench.__main__:main"
queuebench = "scalability.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langbench", "langbench_tasks", "langbench_config", "scalability"]
include-package-data = false

[tool.setuptools.package-dir]
langbench_tasks = "tasks"
langbench_config = "configs"

[tool.setuptools.package-data]
langbench_tasks = ["*/CONTRACT.md", "*/VALIDATION.md", "*/task.json", "*/cases.py", "*/starters/*/*.sh", "*/starters/*/Cargo.*", "*/starters/*/README.md", "*/starters/*/src/*", "*/starters/*/src/**/*", "*/starters/*/*.csproj", "*/starters/*/*.props", "*/starters/*/NuGet.Config", "*/starters/*/tsconfig.json", "*/starters/*/runtime.d.ts", "*/references/*/*.sh", "*/references/*/Cargo.*", "*/references/*/src/*", "*/references/*/src/**/*", "*/references/*/*.csproj", "*/references/*/*.props", "*/references/*/NuGet.Config", "*/references/*/tsconfig.json", "*/references/*/runtime.d.ts"]
langbench_config = ["*.json"]
scalability = ["CONTRACT.md", "requirements.txt", "infra/*.py", "infra/Dockerfile"]

[tool.setuptools.exclude-package-data]
"*" = ["**/target/**", "**/__pycache__/**", "**/*.pyc", "**/.git/**"]
