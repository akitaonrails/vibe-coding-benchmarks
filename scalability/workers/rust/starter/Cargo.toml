[package]
name = "queue_worker"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "=0.3.34"
lapin = { version = "=4.12.1", default-features = false, features = ["tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "signal", "time"] }
